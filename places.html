<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>地點管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 字型不擋住畫面：先用系統字型顯示，字型下載完再換上 -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap"></noscript>
<link rel="stylesheet" href="css/tokens.css?v=20261018d">
<link rel="stylesheet" href="css/base.css?v=20261018d">
<link rel="stylesheet" href="css/places.css?v=20261018d">
</head>
<body>
<div class="pm">

  <!-- 頁首：返回、標題、資料來源狀態、深淺色 -->
  <header class="card pm-head">
    <a class="pm-back" href="index.html" aria-label="返回我的行程">
      <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg>
      <span class="pm-back-text">我的行程</span>
    </a>
    <div class="pm-title">
      <h1>地點管理</h1>
      <p id="pm-sub">搜尋景點、整理地點清單，再安排到每天的行程</p>
    </div>
    <div class="pm-head-actions">
      <span class="pm-source" id="pm-source" hidden></span>
      <button class="tab pm-theme" id="theme-btn" type="button" aria-pressed="false" aria-label="深色模式">
        <svg class="pm-theme-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <span class="pm-theme-text">深色模式</span>
      </button>
    </div>
  </header>

  <!-- 分頁 -->
  <div class="pm-tabs" role="tablist" aria-label="景點管理">
    <button class="tab" role="tab" id="tab-search" aria-controls="panel-search" data-tab="search" aria-selected="true">景點搜尋</button>
    <button class="tab" role="tab" id="tab-pois" aria-controls="panel-pois" data-tab="pois" aria-selected="false">地點清單 <b class="pm-count" id="count-pois">0</b></button>
    <button class="tab" role="tab" id="tab-plan" aria-controls="panel-plan" data-tab="plan" aria-selected="false">行程安排 <b class="pm-count" id="count-plan">0</b></button>
  </div>

  <!-- 1. 景點搜尋 -->
  <section class="pm-panel" id="panel-search" role="tabpanel" aria-labelledby="tab-search">
    <form class="card pm-search" id="search-form" novalidate>
      <div class="pm-field">
        <label for="f-region">搜尋地區</label>
        <select id="f-region" name="region">
          <option value="沖繩" selected>沖繩（全部）</option>
          <option value="那霸">那霸</option>
          <option value="沖繩中部">中部（北谷・恩納・讀谷）</option>
          <option value="沖繩北部">北部（名護・本部・今歸仁）</option>
          <option value="沖繩南部">南部（糸滿・豐見城・南城）</option>
          <option value="宮古島">宮古島</option>
          <option value="石垣島">石垣島</option>
        </select>
      </div>
      <div class="pm-field">
        <label for="f-rating">景點評分</label>
        <select id="f-rating" name="minRating">
          <option value="0" selected>不限</option>
          <option value="3.5">3.5 星以上</option>
          <option value="4">4 星以上</option>
          <option value="4.5">4.5 星以上</option>
        </select>
      </div>
      <div class="pm-field">
        <label for="f-category">景點類型</label>
        <select id="f-category" name="category">
          <option value="attraction">觀光景點</option>
          <option value="nature">自然景觀</option>
          <option value="heritage">文化古蹟</option>
          <option value="shopping">購物中心</option>
          <option value="all" selected>全部類型</option>
        </select>
      </div>
      <div class="pm-search-actions">
        <button class="btn primary" id="search-btn" type="submit">搜尋</button>
      </div>
    </form>

    <div class="pm-results-bar card" id="results-bar" hidden>
      <span class="pm-attrib" id="results-source"></span>
    </div>

    <div id="results" class="pm-results" aria-live="polite"></div>
  </section>

  <!-- 2. 地點清單 -->
  <section class="pm-panel" id="panel-pois" role="tabpanel" aria-labelledby="tab-pois" hidden>
    <div class="card pm-pois-bar">
      <p class="pm-pois-count" id="pois-count"></p>
      <button class="btn primary" id="manual-btn" type="button">手動新增</button>
    </div>
    <div id="pois" class="pm-pois"></div>
  </section>

  <!-- 3. 行程安排 -->
  <section class="pm-panel" id="panel-plan" role="tabpanel" aria-labelledby="tab-plan" hidden>
    <div class="card pm-plan-bar" id="plan-bar">
      <p class="pm-plan-status" id="plan-status" role="status" aria-live="polite"></p>
      <!-- 桌機：右側按鈕；手機：固定在畫面底部的 Bottom navigation（圖示＋文字） -->
      <div class="pm-plan-actions">
        <a class="btn pm-nav-only" id="plan-view" href="index.html?fresh=1"><svg class="pm-nav-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg><span>查看行程</span></a>
        <button class="btn pm-nav-only" id="plan-revert2" type="button" disabled><svg class="pm-nav-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span>放棄變更</span></button>
        <button class="btn pm-danger" id="plan-clear" type="button"><svg class="pm-nav-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/></svg><span>全部清除</span></button>
        <button class="btn primary" id="plan-save" type="button" disabled><svg class="pm-nav-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg><span>確認</span></button>
      </div>
    </div>
    <p class="pm-hint" id="plan-hint"></p>
    <div id="plan" class="pm-plan"></div>
  </section>
</div>

<!-- 對話框（安排衝突、手動新增） -->
<div class="pm-modal" id="modal" hidden>
  <div class="pm-modal-box card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <!-- 標題列：桌機只顯示標題；手機版全螢幕對話框時是 App Bar（✕ 關閉、標題、右側送出） -->
    <div class="pm-modal-bar">
      <button class="pm-modal-x" type="button" data-close aria-label="關閉">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <h2 id="modal-title"></h2>
      <button class="pm-modal-submit" id="modal-submit" type="submit" hidden>儲存</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<!-- 提示訊息 -->
<div class="pm-toasts" id="toasts" role="status" aria-live="polite"></div>

<script src="js/config.js?v=20261018d"></script>
<script src="js/places/poi-logic.js?v=20261018d"></script>
<script src="js/places/demo-data.js?v=20261018d"></script>
<script src="js/places/store.js?v=20261018d"></script>
<script src="js/places/select.js?v=20261018d"></script>
<script src="js/places/app.js?v=20261018d"></script>
</body>
</html>
